[project]
name = "gitten"
version = "0.17.0"
description = "A cute bold-outline kitten that lives on your taskbar and reacts to git activity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7",
    "watchdog>=4.0",
    "psutil>=5.9",
    "pywin32>=306; sys_platform == 'win32'",
    "telethon>=1.36",
    "winrt-Windows.UI.Notifications.Management>=3.0.0; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications>=3.0.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0.0; sys_platform == 'win32'",
    "winrt-Windows.ApplicationModel>=3.0.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.6",
]

[project.scripts]
gitten = "gitten.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
